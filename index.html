<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabek Clone | គេហទំព័រមើលរឿងអនឡាញ</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for Social Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <style>
      :root {
        --primary: #e50914;
        --secondary: #10b981;
        --bg-dark: #0b0f19;
        --bg-card: #161d2f;
        --text-main: #ffffff;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --price-tag: #fbbf24;

        /* Social Colors */
        --color-telegram: #229ed9;
        --color-facebook: #1877f2;
      }

      * {
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Kantumruy Pro", sans-serif;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding-bottom: 70px; /* Space for bottom nav */
      }

      header {
        background-color: rgba(22, 29, 47, 0.98);
        padding: 10px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .logo {
        font-size: 1.1rem;
        font-weight: bold;
        color: var(--primary);
        text-decoration: none;
      }
      .logo span {
        color: white;
      }

      .search-container {
        flex-grow: 1;
        max-width: 400px;
        margin: 0 15px;
      }
      .search-container input {
        width: 100%;
        padding: 8px 15px;
        border-radius: 20px;
        border: 1px solid #334155;
        background: #1e293b;
        color: white;
        outline: none;
        font-size: 0.85rem;
      }

      /* Bottom Navigation */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #161d2f;
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 1001;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.7rem;
        cursor: pointer;
      }

      .nav-item i {
        font-size: 1.2rem;
        margin-bottom: 4px;
      }
      .nav-item.active {
        color: var(--primary);
      }

      /* Social Ticker */
      .social-ticker {
        background: #111827;
        padding: 8px 0;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        overflow: hidden;
        white-space: nowrap;
        display: flex;
      }

      .ticker-wrapper {
        display: inline-block;
        animation: ticker 25s linear infinite;
      }

      @keyframes ticker {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      .ticker-item {
        display: inline-flex;
        align-items: center;
        margin-right: 60px;
        font-size: 0.8rem;
        color: #e2e8f0;
      }

      .ticker-item i {
        margin-right: 8px;
        font-size: 1rem;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 4%;
        flex: 1;
      }

      /* Pages */
      .page {
        display: none;
        animation: fadeIn 0.3s ease-in-out;
      }
      .page.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Movie Grid */
      .movie-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      @media (min-width: 768px) {
        .movie-grid {
          grid-template-columns: repeat(4, 1fr);
          gap: 15px;
        }
      }
      @media (min-width: 1200px) {
        .movie-grid {
          grid-template-columns: repeat(6, 1fr);
          gap: 20px;
        }
      }

      .movie-card {
        background: var(--bg-card);
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .movie-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary);
      }

      .poster-wrapper {
        position: relative;
        padding-top: 145%;
        background: #20293a;
      }
      .poster-wrapper img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .movie-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 0.65rem;
        font-weight: bold;
        color: white;
        z-index: 5;
        background: var(--primary);
      }

      .movie-info {
        padding: 10px;
      }
      .movie-title {
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 5px;
        height: 2.6em;
        overflow: hidden;
        line-height: 1.3;
      }
      .movie-price {
        color: var(--price-tag);
        font-size: 0.75rem;
        font-weight: bold;
      }

      /* Modal Player */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 2000;
        justify-content: center;
        align-items: center;
      }

      .modal-container {
        width: 95%;
        max-width: 1100px;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .video-area {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2100;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.5);
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }

      .lock-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.98);
        z-index: 100;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }

      .pin-box {
        background: #1e293b;
        padding: 25px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        max-width: 320px;
      }

      .pin-input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 2px solid #334155;
        background: #0f172a;
        color: white;
        font-size: 1.4rem;
        text-align: center;
        letter-spacing: 8px;
        margin: 15px 0;
        outline: none;
      }

      .btn-unlock {
        width: 100%;
        padding: 10px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }

      .sidebar {
        background: #0f172a;
        display: flex;
        flex-direction: column;
        max-height: 300px;
      }
      .ep-list {
        padding: 10px;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        background: #1e293b;
      }
      .ep-btn {
        padding: 8px 15px;
        background: #334155;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .ep-btn.active {
        background: var(--primary);
      }

      @media (min-width: 900px) {
        .modal-container {
          flex-direction: row;
          height: 80vh;
        }
        .video-area {
          flex: 3;
          height: 100%;
        }
        .sidebar {
          flex: 1;
          border-left: 1px solid #334155;
          max-height: none;
        }
        .ep-list {
          flex-direction: column;
          overflow-y: auto;
          height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="#" class="logo">TRABEK<span>CLONE</span></a>
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="ស្វែងរកភាពយន្ត..."
          onkeyup="handleSearch()"
        />
      </div>
      <div style="color: var(--price-tag); cursor: pointer" onclick="showQR()">
        <i class="fas fa-heart"></i> Support
      </div>
    </header>

    <div class="social-ticker">
      <div class="ticker-wrapper">
        <span class="ticker-item"
          ><i class="fab fa-telegram" style="color: #229ed9"></i> Telegram:
          @ptpersonal</span
        >
        <span class="ticker-item"
          ><i class="fab fa-facebook" style="color: #1877f2"></i> Facebook: PT
          Personal</span
        >
        <span class="ticker-item"
          ><i class="fa-solid fa-fire" style="color: #e50914"></i> Update
          រឿងថ្មីៗរាល់ថ្ងៃ</span
        >
        <span class="ticker-item"
          ><i class="fab fa-telegram" style="color: #229ed9"></i> Telegram:
          @ptpersonal</span
        >
      </div>
    </div>

    <div class="container">
      <!-- Home Page -->
      <div id="page-home" class="page active">
        <h3 style="margin-bottom: 20px">
          <i class="fas fa-bolt" style="color: var(--price-tag)"></i> រឿងថ្មីៗ
        </h3>
        <div id="homeGrid" class="movie-grid"></div>
        <div style="text-align: center; margin-top: 30px">
          <button
            onclick="showPage('all')"
            style="
              background: transparent;
              border: 1px solid var(--primary);
              color: white;
              padding: 10px 30px;
              border-radius: 25px;
              cursor: pointer;
            "
          >
            មើលរឿងទាំងអស់
          </button>
        </div>
      </div>

      <!-- All Movies Page -->
      <div id="page-all" class="page">
        <h3 style="margin-bottom: 20px">
          <i class="fas fa-list"></i> ភាពយន្តទាំងអស់
        </h3>
        <div id="allGrid" class="movie-grid"></div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div id="nav-home" class="nav-item active" onclick="showPage('home')">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </div>
      <div id="nav-all" class="nav-item" onclick="showPage('all')">
        <i class="fas fa-th-large"></i>
        <span>Movies</span>
      </div>
      <div
        class="nav-item"
        onclick="window.open('https://t.me/ptpersonal', '_blank')"
      >
        <i class="fab fa-telegram-plane"></i>
        <span>Telegram</span>
      </div>
      <div class="nav-item" onclick="showQR()">
        <i class="fas fa-donate"></i>
        <span>Donate</span>
      </div>
    </div>

    <!-- Video Player Modal -->
    <div id="videoModal" class="modal">
      <div class="modal-container">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <div class="video-area">
          <div id="lockOverlay" class="lock-overlay">
            <div class="pin-box">
              <i
                class="fas fa-lock"
                style="font-size: 2.5rem; color: var(--price-tag)"
              ></i>
              <h4 style="margin: 15px 0 5px">ភាគនេះត្រូវបានចាក់សោ</h4>
              <p
                style="
                  font-size: 0.8rem;
                  color: var(--text-muted);
                  margin-bottom: 15px;
                "
              >
                សូមបញ្ចូលលេខកូដដើម្បីដោះសោ
              </p>
              <input
                type="password"
                id="pinInput"
                class="pin-input"
                maxlength="4"
                placeholder="••••"
              />
              <div
                id="errorMsg"
                style="
                  color: #ff4d4d;
                  font-size: 0.8rem;
                  margin-bottom: 10px;
                  display: none;
                "
              >
                លេខកូដមិនត្រឹមត្រូវ!
              </div>
              <button class="btn-unlock" onclick="checkPin()">ដោះសោ</button>
              <a
                id="buyBtn"
                href="#"
                target="_blank"
                style="
                  display: block;
                  margin-top: 15px;
                  color: var(--accent);
                  text-decoration: none;
                  font-size: 0.85rem;
                "
              >
                <i class="fab fa-telegram-plane"></i> ទិញលេខកូដតាម Telegram
              </a>
            </div>
          </div>
          <video
            id="main-video"
            class="video-js vjs-16-9 vjs-big-play-centered"
            controls
            preload="auto"
          ></video>
        </div>
        <div class="sidebar">
          <div style="padding: 15px; border-bottom: 1px solid #334155">
            <h5 id="movieTitle" style="margin: 0; font-size: 1rem"></h5>
            <div
              id="moviePrice"
              style="
                color: var(--price-tag);
                font-size: 0.8rem;
                margin-top: 5px;
              "
            ></div>
          </div>
          <div id="epList" class="ep-list"></div>
        </div>
      </div>
    </div>

    <!-- QR Modal -->
    <div id="qrModal" class="modal" onclick="this.style.display = 'none'">
      <div
        style="
          background: white;
          padding: 25px;
          border-radius: 15px;
          text-align: center;
          color: #333;
        "
        onclick="event.stopPropagation()"
      >
        <h4 style="margin: 0 0 15px">គាំទ្រពួកយើង</h4>
        <img
          src="https://i.imgur.com/MU7eFAP.jpeg"
          style="width: 250px; border-radius: 10px; border: 1px solid #ddd"
        />
        <p style="font-weight: bold; margin-top: 15px">ABA: 010 79 74 74</p>
      </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
      const allMovies = [
        {
          id: 1,
          title: "A Date with the Future",
          type: "រឿងភាគ",
          price: "១០,០០០៛",
          pin: "2222",
          img: "https://i0.wp.com/www.globalgranary.life/wp-content/uploads/2021/11/a-date-with-the-future.jpeg?w=400",
          episodes: [
            {
              ep: 1,
              url: "https://vod-normal-global-cdn-z02.sooplive.co.kr/spkt/save/afreeca/station/2026/0225/23/1772030556458548.mp4/manifest.m3u8",
              locked: false,
            },
            {
              ep: 2,
              url: "https://vod-normal-global-cdn-z02.sooplive.co.kr/spkt/save/afreeca/station/2026/0226/00/1772034632979991.mp4/manifest.m3u8",
              locked: false,
            },
            {
              ep: 3,
              url: "https://vod-normal-global-cdn-z02.sooplive.co.kr/spkt/save/afreeca/station/2026/0226/10/1772070190377318.mp4/manifest.m3u8",
              locked: true,
            },

            {
              ep: 4,
              url: "https://1a-1791.com/video/fwe2/f6/s8/2/4/y/d/3/4yd3z.caa.tar?r_file=chunklist.m3u8&r_type=application%2Fvnd.apple.mpegurl&r_range=333376512-333401755",
              locked: true,
            },
            {
              ep: 5,
              url: "https://1a-1791.com/video/fwe2/09/s8/2/-/l/R/3/-lR3z.baa.tar?r_file=chunklist.m3u8&r_type=application%2Fvnd.apple.mpegurl&r_range=211872768-211897546",
              locked: true,
            },
            {
              ep: 6,
              url: "https://vod-normal-global-cdn-z02.sooplive.co.kr/spkt/save/afreeca/station/2026/0228/23/1772289793137977.mp4/manifest.m3u8",
              locked: true,
            },
          ],
        },
        {
          id: 2,
          title: "Rampage (2018)",
          type: "មួយភាគចប់",
          price: "២,០០០៛",
          pin: "5678",
          img: "https://w0.peakpx.com/wallpaper/659/177/HD-wallpaper-rampage-2018-city-dinosaur-gorilla-hero-movie-war.jpg?w=400",
          episodes: [
            {
              ep: "Full HD",
              url: "https://vod-normal-global-cdn-z02.sooplive.co.kr/spkt/save/afreeca/station/2026/0225/23/1772030556458548.mp4/manifest.m3u8",
              locked: false,
            },
            { ep: "4K (Premium)", url: "#", locked: true },
          ],
        },
        {
          id: 3,
          title: "The Last Immortal",
          type: "រឿងភាគ",
          price: "៨,០០០៛",
          pin: "1111",
          img: "https://i.mydramalist.com/RrYVp_4f.jpg",
          episodes: [{ ep: 1, url: "#", locked: false }],
        },
        {
          id: 4,
          title: "Hidden Love",
          type: "រឿងភាគ",
          price: "៥,០០០៛",
          pin: "2222",
          img: "https://i.mydramalist.com/x6Wj8_4f.jpg",
          episodes: [{ ep: 1, url: "#", locked: false }],
        },
        {
          id: 5,
          title: "Love Like the Galaxy",
          type: "រឿងភាគ",
          price: "១២,០០០៛",
          pin: "3333",
          img: "https://i.mydramalist.com/wVqYx_4f.jpg",
          episodes: [{ ep: 1, url: "#", locked: false }],
        },
        {
          id: 6,
          title: "Falling Into Your Smile",
          type: "រឿងភាគ",
          price: "៧,០០០៛",
          pin: "4444",
          img: "https://i.mydramalist.com/vA170_4f.jpg",
          episodes: [{ ep: 1, url: "#", locked: false }],
        },
      ];

      let player;
      let activeMovie = null;
      let targetUrl = "";
      let targetBtn = null;

      window.onload = () => {
        player = videojs("main-video");
        renderMovies(allMovies);
      };

      function renderMovies(data) {
        const homeGrid = document.getElementById("homeGrid");
        const allGrid = document.getElementById("allGrid");

        homeGrid.innerHTML = data
          .slice(0, 4)
          .map((m) => createCard(m))
          .join("");
        allGrid.innerHTML = data.map((m) => createCard(m)).join("");
      }

      function createCard(m) {
        return `
          <div class="movie-card" onclick="openPlayer(${m.id})">
            <div class="poster-wrapper">
              <span class="movie-badge">${m.type}</span>
              <img src="${m.img}">
            </div>
            <div class="movie-info">
              <div class="movie-title">${m.title}</div>
              <div class="movie-price"><i class="fas fa-tag"></i> ${m.price}</div>
            </div>
          </div>
        `;
      }

      function showPage(pageId) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelectorAll(".nav-item")
          .forEach((n) => n.classList.remove("active"));

        document.getElementById("page-" + pageId).classList.add("active");
        document.getElementById("nav-" + pageId).classList.add("active");
        window.scrollTo(0, 0);
      }

      function openPlayer(id) {
        activeMovie = allMovies.find((m) => m.id === id);
        document.getElementById("movieTitle").innerText = activeMovie.title;
        document.getElementById("moviePrice").innerText =
          "តម្លៃសម្រេច៖ " + activeMovie.price;

        // Auto Telegram Message
        const msg = `សួស្តី! ខ្ញុំចង់ទិញលេខកូដសម្រាប់រឿង៖ ${activeMovie.title} (តម្លៃ៖ ${activeMovie.price})`;
        document.getElementById("buyBtn").href =
          `https://t.me/ptpersonal?text=${encodeURIComponent(msg)}`;

        const epList = document.getElementById("epList");
        epList.innerHTML = activeMovie.episodes
          .map((ep, i) => {
            const unlocked = localStorage.getItem("unlock_" + activeMovie.id);
            return `
            <div class="ep-btn ${i === 0 ? "active" : ""}" onclick="selectEpisode('${ep.url}', this, ${ep.locked})">
              ${ep.locked && !unlocked ? '<i class="fas fa-lock"></i>' : ""} ភាគ ${ep.ep}
            </div>
          `;
          })
          .join("");

        selectEpisode(activeMovie.episodes[0].url, null, false);
        document.getElementById("videoModal").style.display = "flex";
        document.body.style.overflow = "hidden";
      }

      function selectEpisode(url, btn, locked) {
        if (btn) {
          document
            .querySelectorAll(".ep-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        }

        const isUnlocked = localStorage.getItem("unlock_" + activeMovie.id);
        if (locked && !isUnlocked) {
          player.pause();
          targetUrl = url;
          targetBtn = btn;
          document.getElementById("lockOverlay").style.display = "flex";
          document.getElementById("pinInput").value = "";
          document.getElementById("errorMsg").style.display = "none";
        } else {
          document.getElementById("lockOverlay").style.display = "none";
          if (url === "#") return;
          const type = url.includes(".m3u8")
            ? "application/x-mpegURL"
            : "video/mp4";
          player.src({ src: url, type: type });
          player.play().catch(() => {});
        }
      }

      function checkPin() {
        const val = document.getElementById("pinInput").value;
        if (val === activeMovie.pin) {
          localStorage.setItem("unlock_" + activeMovie.id, "true");
          document.getElementById("lockOverlay").style.display = "none";
          openPlayer(activeMovie.id); // Refresh to remove lock icons
          selectEpisode(targetUrl, null, false);
        } else {
          document.getElementById("errorMsg").style.display = "block";
        }
      }

      function closePlayer() {
        player.pause();
        document.getElementById("videoModal").style.display = "none";
        document.body.style.overflow = "auto";
      }

      function showQR() {
        document.getElementById("qrModal").style.display = "flex";
      }

      function handleSearch() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        const filtered = allMovies.filter((m) =>
          m.title.toLowerCase().includes(q),
        );
        renderMovies(filtered);
      }
    </script>
  </body>
</html>

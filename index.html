<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabek Premium V2.5 - Trial Mode Enabled</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #f40612;
            --secondary: #10b981;
            --bg-dark: #06090f;
            --bg-card: #111622;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --label-gold: #f59e0b;
            --label-green: #10b981;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Kantumruy Pro', sans-serif; }

        header { background: rgba(6, 9, 15, 0.95); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--glass); backdrop-filter: blur(15px); }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); cursor: pointer; letter-spacing: 1px; }
        .logo span { color: white; }
        
        .search-container { position: relative; flex: 0 1 400px; margin: 0 20px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-bar { width: 100%; background: var(--glass); border: 1px solid #333; padding: 10px 15px 10px 40px; border-radius: 25px; color: white; outline: none; }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px 4%; }
        
        .movie-grid { display: grid; gap: 20px; grid-template-columns: repeat(2, 1fr); }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1200px) { .movie-grid { grid-template-columns: repeat(6, 1fr); } }

        .movie-card { background: var(--bg-card); border-radius: 14px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid var(--glass); }
        .movie-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(229, 9, 20, 0.2); }
        
        .poster-container { position: relative; width: 100%; aspect-ratio: 2/3; background: #1a202c; overflow: hidden; }
        .poster { width: 100%; height: 100%; object-fit: cover; }
        
        .movie-label { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; z-index: 10; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
        .label-new { background: var(--label-gold); color: black; }
        .label-completed { background: var(--label-green); color: white; }
        .label-premium { background: var(--primary); color: white; }

        .play-badge { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 20; backdrop-filter: blur(5px); background: rgba(16, 185, 129, 0.7); color: white; }

        .movie-info { padding: 15px; }
        .movie-title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(8px); padding: 15px; }
        .form-box { background: var(--bg-card); padding: 30px; border-radius: 20px; width: 100%; max-width: 550px; position: relative; border: 1px solid #333; }
        .close-modal { position: absolute; top: 20px; right: 20px; color: #9ca3af; cursor: pointer; font-size: 1.8rem; }

        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); }
        .btn-secondary { background: var(--secondary); }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #333; background: #0c111d; color: white; font-family: inherit; }

        .admin-tabs { display: flex; gap: 10px; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .tab-btn { padding: 12px 20px; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }

        .player-container { display: flex; flex-direction: column; width: 100%; max-width: 1200px; height: 85vh; background: #000; border-radius: 20px; overflow: hidden; }
        @media (min-width: 992px) { .player-container { flex-direction: row; } }
        .video-main { flex: 3; position: relative; }
        .video-side { flex: 1; background: #0b0f19; padding: 25px; overflow-y: auto; border-left: 1px solid #222; }
        .ep-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .ep-btn { background: #1a202c; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #2d3748; position: relative; }
        .ep-btn.active { background: var(--primary); border-color: var(--primary); }
        .ep-btn.locked { opacity: 0.6; }
        .lock-icon { position: absolute; top: 5px; right: 5px; font-size: 0.7rem; color: #ff4d4d; }

        .my-movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
        .my-movie-item { cursor: pointer; text-align: center; }
        .my-movie-item img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; border: 2px solid var(--glass); }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="adminTrigger">TRABEK<span>PREMIUM</span></div>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-bar" id="movieSearch" placeholder="ស្វែងរកឈ្មោះរឿង..." onkeyup="renderMovies()">
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div id="adminLink" style="display:none; cursor:pointer; color:var(--secondary);" onclick="openAdmin()">
                <i class="fas fa-user-shield"></i> Admin
            </div>
            <div id="userBtn" style="cursor:pointer; background:var(--glass); padding:8px 18px; border-radius:25px;" onclick="openProfile()">
                <i class="fas fa-user-circle"></i> ចូលប្រើ
            </div>
        </div>
    </header>

    <div class="container">
        <h2 style="border-left: 4px solid var(--primary); padding-left: 12px; margin-bottom: 25px;">ភាពយន្តទាំងអស់</h2>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="form-box">
            <span class="close-modal" onclick="closeModal('authModal')">&times;</span>
            <h3 id="authTitle" style="text-align:center;">ចូលប្រើ</h3>
            <input type="text" id="authU" placeholder="ឈ្មោះអ្នកប្រើ">
            <input type="password" id="authP" placeholder="លេខសម្ងាត់">
            <button id="authBtn" class="btn-action btn-primary" onclick="handleAuth()">ចូល</button>
            <p style="text-align:center; font-size:0.8rem;">
                <span id="authToggle" style="color:var(--accent); cursor:pointer;" onclick="toggleAuth()">មិនទាន់មានគណនី? ចុះឈ្មោះ</span>
            </p>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="form-box" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
            <span class="close-modal" onclick="closeModal('profileModal')">&times;</span>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 id="profName" style="margin:0;">User Profile</h3>
                <button class="btn-primary" style="padding:5px 15px; width:auto; border:none; border-radius:20px;" onclick="logout()">ចាកចេញ</button>
            </div>
            <div style="margin-top:25px;">
                <h4 style="border-left:3px solid var(--secondary); padding-left:10px;">រឿងដែលអ្នកបានជាវ (Premium)</h4>
                <div id="myMoviesList" class="my-movies-grid"></div>
            </div>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="modal">
        <div class="form-box" style="max-width: 900px; max-height: 90vh; overflow-y: auto;">
            <span class="close-modal" onclick="closeModal('adminModal')">&times;</span>
            <h3>Admin Panel</h3>
            <div class="admin-tabs">
                <div class="tab-btn active" onclick="switchTab('movies', this)">គ្រប់គ្រងរឿង</div>
                <div class="tab-btn" onclick="switchTab('users', this)">អ្នកប្រើប្រាស់</div>
            </div>

            <div id="panel-movies">
                <div style="background:#0d121d; padding:20px; border-radius:12px; margin-bottom:20px;">
                    <h4 id="formTitle">បន្ថែមរឿងថ្មី</h4>
                    <input type="number" id="mId" placeholder="ID រឿង (លេខ)">
                    <input type="text" id="mTitle" placeholder="ឈ្មោះរឿង">
                    <input type="text" id="mImg" placeholder="Link រូបភាព">
                    <select id="mLabel">
                        <option value="">ធម្មតា (ឥតគិតថ្លៃ)</option>
                        <option value="ថ្មីៗ">ថ្មីៗ</option>
                        <option value="រឿងចេញចប់">រឿងចេញចប់</option>
                        <option value="Premium">Premium (ភាគបន្ទាប់ត្រូវទិញ)</option>
                    </select>
                    <textarea id="mEps" placeholder="Link វីដេអូភាគ (បំបែកដោយសញ្ញាក្បៀស ,)"></textarea>
                    <button class="btn-action btn-primary" onclick="saveMovie()">រក្សាទុករឿង</button>
                </div>
                <div id="adminMovieList" style="background:#0c111d; border-radius:10px; max-height:300px; overflow-y:auto;"></div>
            </div>

            <div id="panel-users" style="display:none;">
                <input type="text" id="userSearch" placeholder="ស្វែងរក User..." onkeyup="renderAdminUsers()">
                <div id="adminUserList" style="background:#0c111d; border-radius:10px; max-height:400px; overflow-y:auto;"></div>
            </div>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal" class="modal">
        <div class="player-container">
            <span class="close-modal" style="color:white; z-index:100;" onclick="closePlayer()">&times;</span>
            <div class="video-main">
                <video id="vjs-player" class="video-js vjs-big-play-centered vjs-16-9" controls preload="auto" width="100%"></video>
                <iframe id="iframe-player" style="display:none; width:100%; height:100%; border:none;" allowfullscreen></iframe>
            </div>
            <div class="video-side">
                <h3 id="playTitle" style="color:var(--primary); margin-top:0;">ចំណងជើង</h3>
                <div class="ep-grid" id="epList"></div>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const DB = {
            movies: () => JSON.parse(localStorage.getItem('tr_movies')) || [],
            users: () => JSON.parse(localStorage.getItem('tr_users')) || [],
            session: () => JSON.parse(localStorage.getItem('tr_session')) || null,
            saveMovies: (d) => localStorage.setItem('tr_movies', JSON.stringify(d)),
            saveUsers: (d) => localStorage.setItem('tr_users', JSON.stringify(d)),
            saveSession: (d) => localStorage.setItem('tr_session', JSON.stringify(d))
        };

        let movies = DB.movies();
        let users = DB.users();
        let currentUser = DB.session();
        let isAdmin = false;
        let isLoginMode = true;
        let vPlayer;

        window.onload = () => {
            vPlayer = videojs('vjs-player');
            renderMovies();
            updateHeader();
            initAdminTrigger();
        };

        function renderMovies() {
            const grid = document.getElementById('movieGrid');
            const search = document.getElementById('movieSearch').value.toLowerCase();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(search));
            
            grid.innerHTML = filtered.map(m => `
                <div class="movie-card" onclick="openMovie(${m.id})">
                    ${m.label ? `<div class="movie-label ${m.label === 'Premium' ? 'label-premium' : m.label === 'ថ្មីៗ' ? 'label-new' : 'label-completed'}">${m.label}</div>` : ''}
                    <div class="play-badge"><i class="fas fa-play"></i></div>
                    <div class="poster-container"><img src="${m.img}" class="poster" onerror="this.src='https://via.placeholder.com/300x450'"></div>
                    <div class="movie-info">
                        <div class="movie-title">${m.title}</div>
                    </div>
                </div>
            `).join('');
        }

        function saveMovie() {
            const id = parseInt(document.getElementById('mId').value);
            const title = document.getElementById('mTitle').value;
            const img = document.getElementById('mImg').value;
            const label = document.getElementById('mLabel').value;
            const eps = document.getElementById('mEps').value.split(',').map(e => e.trim()).filter(e => e);

            if(!id || !title || !img) return alert("សូមបំពេញឱ្យគ្រប់!");

            const idx = movies.findIndex(m => m.id === id);
            if(idx > -1) movies[idx] = {id, title, img, label, episodes: eps};
            else movies.push({id, title, img, label, episodes: eps});

            DB.saveMovies(movies);
            alert("រក្សាទុកជោគជ័យ!");
            renderMovies();
            renderAdminMovies();
            clearMovieForm();
        }

        function renderAdminMovies() {
            const list = document.getElementById('adminMovieList');
            list.innerHTML = movies.map(m => `
                <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #222;">
                    <span>${m.title} (ID: ${m.id})</span>
                    <button onclick="deleteMovie(${m.id})" style="background:red; color:white; border:none; border-radius:4px; cursor:pointer;">លុប</button>
                </div>
            `).join('');
        }

        function deleteMovie(id) {
            movies = movies.filter(m => m.id !== id);
            DB.saveMovies(movies);
            renderMovies();
            renderAdminMovies();
        }

        function clearMovieForm() {
            document.getElementById('mId').value = '';
            document.getElementById('mTitle').value = '';
            document.getElementById('mImg').value = '';
            document.getElementById('mEps').value = '';
        }

        function openMovie(id) {
            const m = movies.find(x => x.id === id);
            const isPremium = m.label === 'Premium';
            const isBought = currentUser && (currentUser.purchased || []).includes(parseInt(id));
            
            document.getElementById('playTitle').innerText = m.title;
            document.getElementById('epList').innerHTML = m.episodes.map((url, i) => {
                // Logic: ភាគ១ និង ភាគ២ គឺមើលបានសេរី ទោះជារឿង Premium ក៏ដោយ
                // ភាគបន្ទាប់ពីនោះ ប្រសិនបើជារឿង Premium គឺត្រូវការសិទ្ធិ (isBought)
                const isTrial = i < 2; 
                const isLocked = isPremium && !isBought && !isTrial;

                return `
                    <div class="ep-btn ${isLocked ? 'locked' : ''}" onclick="${isLocked ? "alert('សូមទាក់ទង Admin ដើម្បីមើលភាគបន្ត!')" : `playEp(${id}, ${i})`}">
                        ភាគ ${i+1}
                        ${isLocked ? '<i class="fas fa-lock lock-icon"></i>' : ''}
                    </div>
                `;
            }).join('');
            
            document.getElementById('playerModal').style.display = 'flex';
            playEp(id, 0);
        }

        function playEp(mid, idx) {
            const m = movies.find(x => x.id === mid);
            const url = m.episodes[idx];
            const iframe = document.getElementById('iframe-player');
            const vjsEl = document.querySelector('#vjs-player');

            document.querySelectorAll('.ep-btn').forEach((btn, i) => {
                if(i === idx) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            if(url.includes('ok.ru') || url.includes('youtube.com') || url.includes('facebook.com')) {
                vPlayer.pause();
                vjsEl.parentElement.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = url;
            } else {
                iframe.style.display = 'none';
                vjsEl.parentElement.style.display = 'block';
                vPlayer.src({ src: url, type: 'video/mp4' });
                vPlayer.play();
            }
        }

        function closePlayer() {
            vPlayer.pause();
            document.getElementById('iframe-player').src = "";
            document.getElementById('playerModal').style.display = 'none';
        }

        function handleAuth() {
            const u = document.getElementById('authU').value;
            const p = document.getElementById('authP').value;
            if(!u || !p) return;

            if(isLoginMode) {
                const found = users.find(x => x.id === u && x.pass === p);
                if(found) { DB.saveSession(found); location.reload(); }
                else alert("ខុសឈ្មោះ ឬលេខសម្ងាត់!");
            } else {
                if(users.find(x => x.id === u)) return alert("ឈ្មោះនេះមានគេប្រើហើយ!");
                users.push({id: u, pass: p, purchased: []});
                DB.saveUsers(users);
                alert("ចុះឈ្មោះជោគជ័យ!");
                toggleAuth();
            }
        }

        function openProfile() {
            if(!currentUser) { document.getElementById('authModal').style.display = 'flex'; return; }
            document.getElementById('profName').innerText = "គណនី៖ " + currentUser.id;
            
            const pIds = currentUser.purchased || [];
            const myMovies = movies.filter(m => pIds.includes(parseInt(m.id)));
            
            document.getElementById('myMoviesList').innerHTML = myMovies.map(m => `
                <div class="my-movie-item" onclick="closeModal('profileModal'); openMovie(${m.id})">
                    <img src="${m.img}">
                    <div style="font-size:0.75rem; margin-top:5px;">${m.title}</div>
                </div>
            `).join('') || '<p style="text-align:center; grid-column:1/-1;">មិនទាន់មានរឿងជាវទេ។</p>';
            
            document.getElementById('profileModal').style.display = 'flex';
        }

        function toggleAuth() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "ចូលប្រើ" : "ចុះឈ្មោះ";
            document.getElementById('authBtn').innerText = isLoginMode ? "ចូល" : "យល់ព្រម";
        }

        function logout() { localStorage.removeItem('tr_session'); location.reload(); }

        function updateHeader() {
            if(currentUser) document.getElementById('userBtn').innerHTML = `<i class="fas fa-user-check"></i> ${currentUser.id}`;
            document.getElementById('adminLink').style.display = isAdmin ? 'block' : 'none';
        }

        function initAdminTrigger() {
            let count = 0;
            document.getElementById('adminTrigger').onclick = () => {
                count++;
                if(count >= 7) {
                    const pin = prompt("Admin PIN:");
                    if(pin === 'admin123') { isAdmin = true; updateHeader(); openAdmin(); }
                    count = 0;
                }
            };
        }

        function openAdmin() { 
            document.getElementById('adminModal').style.display = 'flex'; 
            renderAdminMovies(); 
        }

        function switchTab(t, b) {
            document.getElementById('panel-movies').style.display = t === 'movies' ? 'block' : 'none';
            document.getElementById('panel-users').style.display = t === 'users' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            b.classList.add('active');
            if(t === 'users') renderAdminUsers();
        }

        function renderAdminUsers() {
            const search = document.getElementById('userSearch').value.toLowerCase();
            const list = document.getElementById('adminUserList');
            const filtered = users.filter(u => u.id.toLowerCase().includes(search));

            list.innerHTML = filtered.map(u => `
                <div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #222;">
                    <span>${u.id} (សិទ្ធិមើល ID: ${(u.purchased || []).join(',')})</span>
                    <button onclick="giveAccess('${u.id}')" style="background:var(--accent); color:black; border:none; padding:5px 10px; border-radius:4px;">ឱ្យសិទ្ធិ</button>
                </div>
            `).join('');
        }

        function giveAccess(uid) {
            const id = prompt("បញ្ចូល ID រឿងដែលចង់ឱ្យមើលបាន (ឧ៖ 101):");
            if(!id) return;
            const idx = users.findIndex(u => u.id === uid);
            if(!users[idx].purchased) users[idx].purchased = [];
            users[idx].purchased.push(parseInt(id));
            DB.saveUsers(users);
            alert("បានផ្តល់សិទ្ធិ!");
            renderAdminUsers();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
